<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a quiet responder recovers</title>
<style>
  :root { color-scheme: light; --surface: #fcfcfb; --text: #0b0b0b; --text-2: #52514e; --box: #f1f0ec; --line: #8a8982; --accent: #d4571f; --accent-bg: #fbe6da; --good: #148a5e; --good-bg: #dcf3e8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --surface: #1a1a19; --text: #f0efec; --text-2: #c3c2b7; --box: #262624; --line: #77766f; --accent: #f08a57; --accent-bg: #3a2418; --good: #3fc08d; --good-bg: #17302a; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --surface: #1a1a19; --text: #f0efec; --text-2: #c3c2b7; --box: #262624; --line: #77766f; --accent: #f08a57; --accent-bg: #3a2418; --good: #3fc08d; --good-bg: #17302a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 800px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: var(--text-2); font-size: 14px; }
  figure { margin: 0; }
  svg { width: 100%; height: auto; display: block; color: var(--text); }
  svg text { fill: currentColor; font-family: inherit; font-size: 12px; }
  svg text.t { font-size: 13px; font-weight: 600; }
  svg text.d { fill: var(--text-2); font-size: 11px; }
  svg text.lb { fill: var(--text-2); font-size: 11px; font-style: italic; }
  svg .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
  svg .out { stroke-dasharray: 5 4; }
  svg .hot { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 1.6; }
  svg .good { fill: var(--good-bg); stroke: var(--good); stroke-width: 1.6; }
  svg .ln { fill: none; stroke: var(--line); stroke-width: 1.4; }
  svg .hl { fill: none; stroke: var(--accent); stroke-width: 2; }
  figcaption { margin-top: 12px; font-size: 14px; color: var(--text-2); }
  figcaption b { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>How a quiet responder gets back into work</h1>
  <p class="sub">What the routing code requires, step by step. Source: <code>00-rook/code/dispatch-routing/</code>. This shows the code's rules, not what any one person did.</p>

  <figure>
    <svg viewBox="0 0 760 740" role="img" aria-label="A quiet responder with a yes-history score near zero must be marked available, then get a ping either because a callout lands very close or because everyone ranked above them fails to answer, then answer within 60 seconds. Each taken ping adds 0.08, so about 6 to 7 takes in a row are needed to return to 0.5. Not being available, getting no ping, or missing the ping all leave them quiet.">
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
      </defs>

      <!-- start -->
      <rect class="hot" x="40" y="20" width="320" height="56" rx="8"/>
      <text class="t" x="200" y="42" text-anchor="middle">Quiet responder</text>
      <text class="d" x="200" y="59" text-anchor="middle">yes-history score near 0, so that 25% of the ranking is worth ~0</text>
      <line class="ln" x1="200" y1="76" x2="200" y2="108" marker-end="url(#ar)"/>

      <!-- gate 1 -->
      <rect class="box" x="40" y="110" width="320" height="56" rx="8"/>
      <text class="t" x="200" y="132" text-anchor="middle">1 · Marked available in the area?</text>
      <text class="d" x="200" y="150" text-anchor="middle">availability.py · set in the app by the responder or handler</text>
      <line class="ln" x1="200" y1="166" x2="200" y2="198" marker-end="url(#ar)"/>
      <text class="lb" x="208" y="187">yes</text>
      <line class="ln" x1="360" y1="138" x2="468" y2="138" marker-end="url(#ar)"/>
      <text class="lb" x="408" y="132">no</text>
      <rect class="box out" x="470" y="110" width="250" height="56" rx="8"/>
      <text class="t" x="595" y="132" text-anchor="middle">Not on the list at all</text>
      <text class="d" x="595" y="150" text-anchor="middle">no pings · stays quiet</text>

      <!-- gate 2 -->
      <rect class="box" x="40" y="200" width="320" height="44" rx="8"/>
      <text class="t" x="200" y="220" text-anchor="middle">2 · Do they get a ping? Two ways in</text>
      <text class="d" x="200" y="236" text-anchor="middle">they are only asked if they are ranked high enough or the list reaches them</text>
      <line class="ln" x1="360" y1="222" x2="468" y2="222" marker-end="url(#ar)"/>
      <text class="lb" x="395" y="216">neither</text>
      <rect class="box out" x="470" y="200" width="250" height="44" rx="8"/>
      <text class="t" x="595" y="219" text-anchor="middle">No ping, score stays put</text>
      <text class="d" x="595" y="235" text-anchor="middle">nothing in the code decays it</text>

      <line class="ln" x1="117" y1="244" x2="117" y2="274" marker-end="url(#ar)"/>
      <line class="ln" x1="283" y1="244" x2="283" y2="274" marker-end="url(#ar)"/>
      <rect class="box" x="40" y="276" width="155" height="74" rx="8"/>
      <text class="t" x="117" y="297" text-anchor="middle">A callout lands</text>
      <text class="t" x="117" y="313" text-anchor="middle">very close to them</text>
      <text class="d" x="117" y="332" text-anchor="middle">proximity is 60% of score</text>
      <text class="d" x="117" y="345" text-anchor="middle">routing.py</text>
      <rect class="box" x="205" y="276" width="155" height="74" rx="8"/>
      <text class="t" x="283" y="297" text-anchor="middle">Everyone above</text>
      <text class="t" x="283" y="313" text-anchor="middle">them says no or misses</text>
      <text class="d" x="283" y="332" text-anchor="middle">list is worked down in order</text>
      <text class="d" x="283" y="345" text-anchor="middle">offer.py</text>

      <polyline class="ln" points="117,350 117,370 200,370 200,390" marker-end="url(#ar)"/>
      <polyline class="ln" points="283,350 283,370 200,370"/>

      <!-- gate 3 -->
      <rect class="box" x="40" y="392" width="320" height="56" rx="8"/>
      <text class="t" x="200" y="414" text-anchor="middle">3 · Do they answer within 60 seconds?</text>
      <text class="d" x="200" y="432" text-anchor="middle">offer.py · the 60 is set in config.py</text>
      <line class="ln" x1="360" y1="420" x2="468" y2="420" marker-end="url(#ar)"/>
      <text class="lb" x="408" y="414">no</text>
      <rect class="box out" x="470" y="392" width="250" height="56" rx="8"/>
      <text class="t" x="595" y="414" text-anchor="middle">Missed: −0.12</text>
      <text class="d" x="595" y="432" text-anchor="middle">already at 0 · stays quiet</text>
      <line class="hl" x1="200" y1="448" x2="200" y2="482" marker-end="url(#ah)"/>
      <text class="lb" x="208" y="470">yes, and they take it</text>

      <!-- taken -->
      <rect class="hot" x="40" y="484" width="320" height="56" rx="8"/>
      <text class="t" x="200" y="506" text-anchor="middle">4 · Taken ping: +0.08</text>
      <text class="d" x="200" y="524" text-anchor="middle">history.py · the only thing in the code that adds points</text>
      <line class="hl" x1="200" y1="540" x2="200" y2="574" marker-end="url(#ah)"/>

      <!-- repeat -->
      <rect class="hot" x="40" y="576" width="320" height="62" rx="8"/>
      <text class="t" x="200" y="598" text-anchor="middle">5 · Repeat: about 6 to 7 takes in a row</text>
      <text class="d" x="200" y="615" text-anchor="middle">to get back to the 0.5 everyone starts at</text>
      <text class="d" x="200" y="629" text-anchor="middle">each miss or turn-down (−0.12) cancels one and a half takes</text>
      <line class="hl" x1="200" y1="638" x2="200" y2="670" marker-end="url(#ah)"/>

      <!-- recovered -->
      <rect class="good" x="40" y="672" width="320" height="50" rx="8"/>
      <text class="t" x="200" y="694" text-anchor="middle">Ranked higher next time</text>
      <text class="d" x="200" y="710" text-anchor="middle">asked earlier on the list, so more pings</text>
    </svg>
    <figcaption>
      <b>Only the left column leads back to work.</b> Being unavailable, getting no ping, or missing the ping (dashed boxes) all leave the score where it is or lower. The only thing that raises it is a taken ping, worth +0.08, and a ping is only sent if the person is available and either very close or the next one down a list where everyone above has said no. Nothing in the code lets the score drift back on its own: a 2019 comment in <code>history.py</code> asks whether it should, and says it was left out.
    </figcaption>
  </figure>
</main>
</body>
</html>
