<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How Dispatch picks who to ask</title>
<style>
  :root { color-scheme: light; --surface: #fcfcfb; --text: #0b0b0b; --text-2: #52514e; --box: #f1f0ec; --line: #8a8982; --accent: #d4571f; --accent-bg: #fbe6da; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --surface: #1a1a19; --text: #f0efec; --text-2: #c3c2b7; --box: #262624; --line: #77766f; --accent: #f08a57; --accent-bg: #3a2418; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --surface: #1a1a19; --text: #f0efec; --text-2: #c3c2b7; --box: #262624; --line: #77766f; --accent: #f08a57; --accent-bg: #3a2418; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 800px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: var(--text-2); font-size: 14px; }
  figure { margin: 0; }
  svg { width: 100%; height: auto; display: block; color: var(--text); }
  svg text { fill: currentColor; font-family: inherit; font-size: 12px; }
  svg text.t { font-size: 13px; font-weight: 600; }
  svg text.d { fill: var(--text-2); font-size: 11px; }
  svg .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
  svg .out { stroke-dasharray: 5 4; }
  svg .hot { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 1.6; }
  svg .ln { fill: none; stroke: var(--line); stroke-width: 1.4; }
  svg .hl { fill: none; stroke: var(--accent); stroke-width: 2; }
  svg text.hotx { fill: var(--accent); font-weight: 600; }
  figcaption { margin-top: 12px; font-size: 14px; color: var(--text-2); }
  figcaption b { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>How Dispatch picks who to ask</h1>
  <p class="sub">From "something went wrong" to a phone buzzing, with the file each step lives in. Source: <code>00-rook/code/dispatch-routing/</code>.</p>

  <figure>
    <svg viewBox="0 0 760 660" role="img" aria-label="Flow of a callout through Dispatch: find who is free, score them on three weighted inputs, rank them, ask the top person for 60 seconds, then update their yes-history score. If nobody took it, the next person is asked. The updated score feeds the next ranking.">
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker>
      </defs>

      <!-- main column -->
      <rect class="box out" x="40" y="20" width="280" height="50" rx="8"/>
      <text class="t" x="180" y="41" text-anchor="middle">A callout comes in</text>
      <text class="d" x="180" y="58" text-anchor="middle">handler enters it in the console · not in this folder</text>

      <rect class="box" x="40" y="104" width="280" height="62" rx="8"/>
      <text class="t" x="180" y="126" text-anchor="middle">1 · Who is free right now?</text>
      <text class="d" x="180" y="143" text-anchor="middle">everyone marked available in that area</text>
      <text class="d" x="180" y="158" text-anchor="middle">availability.py</text>

      <rect class="box" x="40" y="200" width="280" height="62" rx="8"/>
      <text class="t" x="180" y="222" text-anchor="middle">2 · Score each free person</text>
      <text class="d" x="180" y="239" text-anchor="middle">three inputs, each with a weight</text>
      <text class="d" x="180" y="254" text-anchor="middle">routing.py</text>

      <rect class="box" x="40" y="296" width="280" height="62" rx="8"/>
      <text class="t" x="180" y="318" text-anchor="middle">3 · Rank them, best score first</text>
      <text class="d" x="180" y="335" text-anchor="middle">nobody is removed, only put in order</text>
      <text class="d" x="180" y="350" text-anchor="middle">routing.py</text>

      <rect class="box" x="40" y="392" width="280" height="62" rx="8"/>
      <text class="t" x="180" y="414" text-anchor="middle">4 · Ask the top person</text>
      <text class="d" x="180" y="431" text-anchor="middle">phone buzzes · 60 seconds to answer (was 90)</text>
      <text class="d" x="180" y="446" text-anchor="middle">offer.py · the 60 is set in config.py</text>

      <rect class="box" x="40" y="490" width="88" height="46" rx="8"/>
      <text class="t" x="84" y="510" text-anchor="middle">Taken</text>
      <text class="d" x="84" y="527" text-anchor="middle">done · +0.08</text>
      <rect class="box" x="136" y="490" width="88" height="46" rx="8"/>
      <text class="t" x="180" y="510" text-anchor="middle">Turned down</text>
      <text class="d" x="180" y="527" text-anchor="middle">−0.12</text>
      <rect class="box" x="232" y="490" width="88" height="46" rx="8"/>
      <text class="t" x="276" y="510" text-anchor="middle">Missed</text>
      <text class="d" x="276" y="527" text-anchor="middle">no answer · −0.12</text>

      <rect class="hot" x="40" y="574" width="280" height="56" rx="8"/>
      <text class="t" x="180" y="596" text-anchor="middle">5 · Update their yes-history score</text>
      <text class="d" x="180" y="614" text-anchor="middle">history.py</text>

      <!-- main flow arrows -->
      <line class="ln" x1="180" y1="70" x2="180" y2="102" marker-end="url(#ar)"/>
      <line class="ln" x1="180" y1="166" x2="180" y2="198" marker-end="url(#ar)"/>
      <line class="ln" x1="180" y1="262" x2="180" y2="294" marker-end="url(#ar)"/>
      <line class="ln" x1="180" y1="358" x2="180" y2="390" marker-end="url(#ar)"/>
      <line class="ln" x1="84" y1="454" x2="84" y2="488" marker-end="url(#ar)"/>
      <line class="ln" x1="180" y1="454" x2="180" y2="488" marker-end="url(#ar)"/>
      <line class="ln" x1="276" y1="454" x2="276" y2="488" marker-end="url(#ar)"/>
      <line class="hl" x1="84" y1="536" x2="84" y2="572" marker-end="url(#ah)"/>
      <line class="hl" x1="180" y1="536" x2="180" y2="572" marker-end="url(#ah)"/>
      <line class="hl" x1="276" y1="536" x2="276" y2="572" marker-end="url(#ah)"/>

      <!-- three scoring inputs -->
      <rect class="box" x="440" y="104" width="290" height="56" rx="8"/>
      <text class="t" x="452" y="124">How fast can they get there?</text>
      <text class="d" x="452" y="141">weight 60% (was 45%) · 0 past 45 minutes</text>
      <text class="d" x="452" y="154">routing.py · travel time from availability.py</text>

      <rect class="box" x="440" y="172" width="290" height="56" rx="8"/>
      <text class="t" x="452" y="192">Can they do this kind of work?</text>
      <text class="d" x="452" y="209">weight 15% (unchanged) · share of needed tags</text>
      <text class="d" x="452" y="222">routing.py</text>

      <rect class="hot" x="440" y="240" width="290" height="56" rx="8"/>
      <text class="t" x="452" y="260">How often did they say yes lately?</text>
      <text class="d" x="452" y="277">weight 25% (was 40%) · starts at 0.5, floor 0</text>
      <text class="d" x="452" y="290">history.py</text>

      <!-- inputs into step 2 -->
      <polyline class="ln" points="440,132 380,132 380,213 322,213" marker-end="url(#ar)"/>
      <polyline class="ln" points="440,200 400,200 400,231 322,231" marker-end="url(#ar)"/>
      <polyline class="hl" points="440,268 360,268 360,249 322,249" marker-end="url(#ah)"/>

      <!-- loop: not taken -> ask next person -->
      <polyline class="ln" points="320,592 360,592 360,423 322,423" marker-end="url(#ar)"/>
      <text class="d" x="368" y="500">Not taken?</text>
      <text class="d" x="368" y="515">Ask the next person on the list.</text>
      <text class="d" x="368" y="530">Taken? Stop.</text>

      <!-- feedback: score -> next ranking -->
      <polyline class="hl" points="320,612 585,612 585,298" marker-end="url(#ah)"/>
      <text class="hotx" x="595" y="440">The new score is used</text>
      <text class="hotx" x="595" y="456">the next time anyone</text>
      <text class="hotx" x="595" y="472">is ranked.</text>
    </svg>
    <figcaption>
      <b>Read it top to bottom.</b> Find who is free, score them, rank them, ask the top person, record the answer, and move down the list until someone says yes. <b>The orange path is the feedback loop:</b> every turn-down or missed ping lowers that person's yes-history score by 0.12, and a low score ranks them lower the next time. Since 4.2 the speed input counts for more and the yes-history input for less, and the wait is 60 seconds instead of 90. Dashed box: outside this folder. Boxes in this folder that find who is free, estimate travel time and buzz the phone are placeholders in this copy of the code.
    </figcaption>
  </figure>
</main>
</body>
</html>
